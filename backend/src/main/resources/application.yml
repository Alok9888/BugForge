server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bugforge-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/reactcode}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  evaluator:
    url: ${EVALUATOR_URL:http://localhost:8090}
    token: ${EVALUATOR_TOKEN:local-dev-only-change-me}
  cors:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  catalog:
    mvp-size: 10
