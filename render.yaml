databases:
  - name: bugforge-db
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "16"
    databaseName: reactcode
    user: postgres

envVarGroups:
  - name: bugforge-evaluator-auth
    envVars:
      - key: EVALUATOR_TOKEN
        generateValue: true

services:
  - type: web
    name: bugforge-platform
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: BACKEND_HOSTPORT
        fromService:
          type: pserv
          name: bugforge-api
          property: hostport

  - type: pserv
    name: bugforge-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bugforge-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: bugforge-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: bugforge-db
          property: password
      - key: EVALUATOR_URL
        fromService:
          type: pserv
          name: bugforge-evaluator
          property: hostport
      - fromGroup: bugforge-evaluator-auth
      - key: PORT
        value: "10000"
      - key: SERVER_PORT
        value: "10000"

  - type: pserv
    name: bugforge-evaluator
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./evaluator/Dockerfile
    dockerContext: ./evaluator
    envVars:
      - fromGroup: bugforge-evaluator-auth
      - key: PORT
        value: "10000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
